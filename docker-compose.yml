services:
  change-tracker:
    build: .
    restart: unless-stopped
    environment:
      WATCH_URL: "https://example.com/event"
      INTERVAL_MIN: "15"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_USER: "you@gmail.com"
      SMTP_PASS: "app-password"
      # First = admin (all mails); others get "Page changed" only. Separate with , or ;
      MAIL_TO: "you@gmail.com, family@example.com"
      # CSS_SELECTOR: "main"
    volumes:
      - ./data:/data
